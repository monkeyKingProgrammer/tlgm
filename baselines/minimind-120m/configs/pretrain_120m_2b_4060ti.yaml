model:
  hidden_size: 960
  num_hidden_layers: 10
  use_moe: false
  vocab_size: 6400
  num_attention_heads: 10
  num_key_value_heads: 5

tokenizer_path: ../MiniMind/model
data_path: data/processed/pretrain_2b
output_checkpoint: checkpoints/pretrain_120m_960_2b.pth
resume_checkpoint: checkpoints/pretrain_120m_960_2b.pth
log_path: outputs/pretrain_120m_2b_loss.jsonl

training:
  stage: pretrain
  device: cuda
  dtype: float16
  batch_size: 2
  gradient_accumulation_steps: 32
  context_length: 1024
  learning_rate: 0.0003
  max_steps: 30518
  warmup_steps: 1000
  save_steps: 500
  eval_steps: 500
  eval_batches: 8
  grad_clip: 1.0
  num_workers: 2
  seed: 120
