model:
  vocab_size: 8192
  context_length: 1024
  embed_dim: 768
  model_dim: 768
  num_global_blocks: 16
  local_hidden_dim: 3072
  feature_hidden_dim: 3072
  dropout: 0.0
  pad_token_id: 0
  bos_token_id: 1
  eos_token_id: 2
  unk_token_id: 3
  tie_embeddings: true

data:
  train_bin: data/processed/knowledge3b_tokens.bin
  meta: data/processed/knowledge3b_tokens_meta.json

init_checkpoint: checkpoints/tlgm_120m_1024ctx_pretrain.pth
checkpoint_path: checkpoints/tlgm_120m_1024ctx_knowledge3b_pretrain.pth
log_path: outputs/tlgm_1024ctx_knowledge3b_pretrain_loss.jsonl
tensorboard_dir: outputs/tensorboard_knowledge3b_pretrain

training:
  device: cuda
  dtype: float16
  batch_size: 1
  gradient_accumulation_steps: 64
  learning_rate: 0.0001
  weight_decay: 0.1
  max_steps: 45777
  warmup_steps: 1000
  save_steps: 500
  grad_clip: 1.0
  num_workers: 0
  seed: 220
