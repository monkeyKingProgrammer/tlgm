model:
  vocab_size: 8192
  context_length: 1024
  embed_dim: 768
  model_dim: 768
  num_global_blocks: 16
  local_hidden_dim: 3072
  feature_hidden_dim: 3072
  dropout: 0.0
  pad_token_id: 0
  bos_token_id: 1
  eos_token_id: 2
  unk_token_id: 3
  tie_embeddings: true

data:
  sft_jsonl: ../minimind_120m_tiny_chatgpt/data/processed/sft_chat_mix.jsonl
  tokenizer_dir: tokenizer

init_checkpoint: checkpoints/tlgm_120m_1024ctx_knowledge3b_pretrain.pth
checkpoint_path: checkpoints/tlgm_120m_1024ctx_knowledge3b_sft_chatmix.pth
log_path: outputs/tlgm_1024ctx_knowledge3b_sft_chatmix_loss.jsonl
tensorboard_dir: outputs/tensorboard_knowledge3b_sft_chatmix

training:
  device: cuda
  dtype: float16
  batch_size: 1
  gradient_accumulation_steps: 64
  learning_rate: 0.000001
  weight_decay: 0.01
  max_steps: 5000
  warmup_steps: 300
  save_steps: 500
  grad_clip: 1.0
  num_workers: 0
  seed: 221
