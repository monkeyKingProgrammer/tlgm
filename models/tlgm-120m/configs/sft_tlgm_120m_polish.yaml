model:
  vocab_size: 8192
  context_length: 256
  embed_dim: 768
  model_dim: 768
  num_global_blocks: 22
  local_hidden_dim: 3072
  feature_hidden_dim: 3072
  dropout: 0.0
  pad_token_id: 0
  bos_token_id: 1
  eos_token_id: 2
  unk_token_id: 3
  tie_embeddings: true

data:
  sft_jsonl: data/processed/sft_polish.jsonl
  tokenizer_dir: tokenizer

init_checkpoint: checkpoints/tlgm_120m_sft_final.pth
checkpoint_path: checkpoints/tlgm_120m_sft_polished.pth
log_path: outputs/tlgm_sft_polish_loss.jsonl
tensorboard_dir: outputs/tensorboard_sft_polish

training:
  device: cuda
  dtype: float16
  batch_size: 8
  gradient_accumulation_steps: 16
  learning_rate: 0.000002
  weight_decay: 0.01
  max_steps: 600
  warmup_steps: 50
  save_steps: 200
  grad_clip: 1.0
  num_workers: 2
  seed: 125
