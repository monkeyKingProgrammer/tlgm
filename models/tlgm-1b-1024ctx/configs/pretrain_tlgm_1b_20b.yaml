model:
  vocab_size: 8192
  context_length: 1024
  embed_dim: 2048
  model_dim: 2048
  num_global_blocks: 27
  local_hidden_dim: 8192
  feature_hidden_dim: 8192
  dropout: 0.0
  pad_token_id: 0
  bos_token_id: 1
  eos_token_id: 2
  unk_token_id: 3
  tie_embeddings: true
  initializer_range: 0.02
  scale_residual_projections: true

data:
  train_bin: data/processed/pretrain20b_tokens.bin
  meta: data/processed/pretrain20b_tokens_meta.json

checkpoint_path: checkpoints/tlgm_1b_1024ctx_pretrain20b.pth
log_path: outputs/tlgm_1b_1024ctx_pretrain20b_loss.jsonl
tensorboard_dir: outputs/tensorboard_pretrain20b

validation:
  enabled: true
  holdout_samples: 10000
  eval_steps: 500
  eval_batches: 8

training:
  device: cuda
  # BF16 avoids the FP16 overflow/stall observed during late pretraining on Blackwell.
  dtype: bfloat16
  batch_size: 8
  gradient_accumulation_steps: 8
  learning_rate: 0.00015
  weight_decay: 0.1
  max_steps: 305176
  warmup_steps: 3000
  save_steps: 500
  grad_clip: 1.0
  num_workers: 0
  seed: 1001
